# 合併到 main 後，自動把 dist/ 推送到 Google Apps Script 並更新現有的網頁應用程式部署（網址不變）。
#
# 需要在 GitHub「Settings → Secrets and variables → Actions」設定三個 Secrets（設定方式見 README「自動部署」）：
#   CLASPRC_JSON   clasp login 產生的 ~/.clasprc.json 內容
#   SCRIPT_ID      Apps Script 專案設定裡的「指令碼 ID」
#   DEPLOYMENT_ID  部署 → 管理部署作業 裡的「部署作業 ID」
name: 部署到 Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'gas/**'
      - 'dist/**'
      - 'scripts/**'
      - 'test/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-apps-script
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: 測試
        run: node test/run.js

      - name: 檢查 Secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          missing=""
          [ -z "$CLASPRC_JSON" ] && missing="$missing CLASPRC_JSON"
          [ -z "$SCRIPT_ID" ] && missing="$missing SCRIPT_ID"
          [ -z "$DEPLOYMENT_ID" ] && missing="$missing DEPLOYMENT_ID"
          if [ -n "$missing" ]; then
            echo "::error::尚未設定 Secrets：$missing（請照 README「自動部署」設定）"
            exit 1
          fi
          echo "$CLASPRC_JSON" | node -e 'JSON.parse(require("fs").readFileSync(0, "utf8"))' \
            || { echo "::error::CLASPRC_JSON 不是有效的 JSON，請重新複製 .clasprc.json 的完整內容"; exit 1; }
          sid="$(echo "$SCRIPT_ID" | tr -d '[:space:]')"
          did="$(echo "$DEPLOYMENT_ID" | tr -d '[:space:]')"
          if [[ "$sid" == AKfy* ]]; then
            echo "::error::SCRIPT_ID 看起來是部署作業 ID（AKfy 開頭）。SCRIPT_ID 要填 Apps Script「專案設定 → 指令碼 ID」"; exit 1
          fi
          if [[ "$did" != AKfy* ]]; then
            echo "::error::DEPLOYMENT_ID 應該是 AKfy 開頭（網頁應用程式網址 /s/ 和 /exec 中間那段），請檢查是否和 SCRIPT_ID 填反"; exit 1
          fi
          echo "SCRIPT_ID 長度：${#sid}（指令碼 ID 通常約 57 字元；若是 44 字元，可能填成了試算表 ID）"

      - name: 安裝 clasp
        run: npm install -g @google/clasp@3.4.1

      - name: 設定 clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json
          node -e 'require("fs").writeFileSync(".clasp.json", JSON.stringify({ scriptId: process.env.SCRIPT_ID.trim(), rootDir: "dist" }))'

      - name: 上傳程式碼
        run: clasp push --force

      # clasp 只會顯示「Request contains an invalid argument」，這一步直接問 Apps Script API 拿詳細原因。
      # 只印出 API 回傳的錯誤訊息，不會印出任何金鑰。
      - name: 診斷（上傳失敗時）
        if: failure()
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          token=$(echo "$CLASPRC_JSON" | node -e '
            const c = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const t = (c.tokens && (c.tokens.default || Object.values(c.tokens)[0])) || c.token || c;
            const body = new URLSearchParams({ client_id: t.client_id || (c.oauth2ClientSettings || {}).clientId,
              client_secret: t.client_secret || (c.oauth2ClientSettings || {}).clientSecret,
              refresh_token: t.refresh_token, grant_type: "refresh_token" });
            fetch("https://oauth2.googleapis.com/token", { method: "POST", body })
              .then((r) => r.json()).then((j) => {
                if (!j.access_token) { console.error("無法用 refresh_token 取得授權：" + (j.error_description || j.error)); process.exit(1); }
                process.stdout.write(j.access_token);
              });
          ') || { echo "::error::CLASPRC_JSON 的授權已失效或被移除，請重新執行 clasp login 並更新 Secret"; exit 0; }
          echo "::add-mask::$token"
          sid="$(echo "$SCRIPT_ID" | tr -d '[:space:]')"
          echo "== 讀取專案（檢查 SCRIPT_ID 是否正確）=="
          curl -sS -H "Authorization: Bearer $token" "https://script.googleapis.com/v1/projects/$sid" \
            | node -e 'const j = JSON.parse(require("fs").readFileSync(0, "utf8")); console.log(j.error ? JSON.stringify(j.error, null, 2) : "OK：找到專案「" + j.title + "」")'
          echo "== 用目前的 dist/ 試著上傳，顯示詳細錯誤 =="
          node -e '
            const fs = require("fs");
            const files = [
              { name: "appsscript", type: "JSON", source: fs.readFileSync("dist/appsscript.json", "utf8") },
              { name: "家庭記帳", type: "SERVER_JS", source: fs.readFileSync("dist/家庭記帳.gs", "utf8") }
            ];
            process.stdout.write(JSON.stringify({ files }));
          ' > /tmp/content.json
          curl -sS -X PUT -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            --data-binary @/tmp/content.json "https://script.googleapis.com/v1/projects/$sid/content" \
            | node -e 'const j = JSON.parse(require("fs").readFileSync(0, "utf8")); console.log(j.error ? JSON.stringify(j.error, null, 2) : "上傳成功（代表問題在 clasp 設定）")'
          rm -f /tmp/content.json

      - name: 更新網頁應用程式部署
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: clasp update-deployment "$(echo "$DEPLOYMENT_ID" | tr -d '[:space:]')" --description "GitHub ${GITHUB_SHA::7}"

      - name: 清除憑證
        if: always()
        run: rm -f ~/.clasprc.json .clasp.json
